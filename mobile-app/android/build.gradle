// Top-level build file where you can add configuration options common to all sub-projects/modules.
 
buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '35')
        // React Native 0.77 uses Kotlin 2.x on Android.
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.0.21'
 
        // NDK r28+ builds 16KB-aligned native code by default
        ndkVersion = "28.0.12433566"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.0')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}
 
apply plugin: "com.facebook.react.rootproject"
 
// Ensure all native modules compile against the same React Native Android artifacts.
// Some libraries still request the legacy Maven artifact `com.facebook.react:react-native:+`,
// which can resolve to an incompatible version and break Kotlin compilation.
def getReactNativeAndroidVersion() {
    def rnPackageJson = new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim())
    def rnDir = rnPackageJson.parentFile
 
    def reactProperties = new Properties()
    file("$rnDir/ReactAndroid/gradle.properties").withInputStream { reactProperties.load(it) }
    return reactProperties.getProperty('VERSION_NAME')
}
 
def REACT_NATIVE_ANDROID_VERSION = getReactNativeAndroidVersion()
 
allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }
 
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
 
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.facebook.react') {
                // Substitute the legacy artifact name with the modern split artifact.
                if (details.requested.name == 'react-native') {
                    details.useTarget("com.facebook.react:react-android:${REACT_NATIVE_ANDROID_VERSION}")
                    details.because('React Native 0.71+ uses react-android; react-native:+ can resolve incompatible artifacts')
                } else {
                    // If a module requests a floating / missing version, pin to the app's RN version.
                    if (details.requested.version == null || details.requested.version == '+') {
                        details.useVersion(REACT_NATIVE_ANDROID_VERSION)
                        details.because('Pin com.facebook.react artifacts to the app\'s React Native version')
                    }
                }
            }
        }
    }
}